# 文件路径 .github/workflows/deployment.yml
# 作用：push 到 hexo 分支时，自动构建静态站点并推送到 master 分支（GitHub Pages）
name: Deployment

on:
  push:
    branches: [hexo] # 只有源分支 hexo 的 push 才触发部署
  workflow_dispatch: # 支持手动触发

# 授予 GITHUB_TOKEN 推送内容到仓库的权限（用于部署到 master 分支）
permissions:
  contents: write

jobs:
  hexo-deployment:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Hexo 7 要求 Node >= 14，这里用当前 LTS
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: |
          node -v
          npx hexo clean
          npx hexo generate

      - name: Deploy to Github Pages
        env:
          GIT_NAME: aoij
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          REPO: github.com/aoij/aoij.github.io
          # 使用 GitHub 自动提供的 GITHUB_TOKEN，避免个人令牌过期导致部署失败
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./public
          git init -q
          git add -A
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"
          git commit -q -m "Site deployed by GitHub Actions"
          git push --force --quiet "https://x-access-token:$GH_TOKEN@$REPO" master:master
          echo "Deploy Successful!"